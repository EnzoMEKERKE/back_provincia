nelmio_cors:
    defaults:
        origin_regex: false
        allow_origin: []
        allow_methods: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'OPTIONS']
        allow_headers: ['Content-Type', 'Authorization']
        expose_headers: []
        max_age: 3600

    paths:
        '^/api/':
            allow_origin:
                - 'http://localhost:3000'
                - 'http://127.0.0.1:3000'
            allow_methods:
                - 'GET'
                - 'POST'
                - 'PUT'
                - 'PATCH'
                - 'DELETE'
                - 'OPTIONS'
            allow_headers:
                - 'Content-Type'
                - 'Authorization'
            max_age: 3600